      <div id="cp" class="a" style="left:18px;right:18px;top:148px;height:92px;border:1px solid #e8dfd3;border-radius:13px;background:#fff;box-shadow:0 8px 24px -16px rgba(60,40,20,.3)">
        <div class="a" style="left:15px;top:16px;right:15px;font:400 13px/18px var(--sans);letter-spacing:-.005em"><span id="gt">Run the full suite and open a PR</span><i class="caret" id="gc" style="height:15px;vertical-align:-.2em"></i></div>
        <div id="hint" class="a" style="right:12px;bottom:11px;display:flex;align-items:center;gap:7px;font:400 10px/1 var(--sans);color:#9b958d"><span id="kc" class="keycap">Tab</span>accept<span style="opacity:.5">·</span><span class="keycap" style="min-width:0;font-weight:500">Esc</span>dismiss</div>
        <div id="sent" class="a" style="left:15px;bottom:11px;font:400 10px/1 var(--sans);color:#9b958d">Suggested from this turn</div>
      </div>`,
    update(r, lt) {
      vis($('#g1', r), lt, .1); vis($('#g2', r), lt, .25); vis($('#g3', r), lt, .45); vis($('#g4', r), lt, .6);
      vis($('#cp', r), lt, .4, .3, 6);
      const gt = $('#gt', r), real = eo(seg(lt, 2.05, 2.3));
      gt.style.color = mix('#c3bcb1', '#1d1d1f', real);
      const gp = seg(lt, .95, 1.3);
      gt.style.opacity = gp;
      $('#gc', r).style.opacity = lt < 1.0 ? blink(lt) : (lt > 2.3 ? blink(lt - 2.3) : 0);
      const pulse = lt > 1.4 && lt < 2.05 ? .5 + .5 * Math.sin((lt - 1.4) * 9) : 0;
      const kc = $('#kc', r), press = seg(lt, 1.98, 2.06) * (1 - seg(lt, 2.1, 2.2));
      kc.style.boxShadow = `0 ${2 - press * 1.5}px 0 #d9d1c5, 0 0 0 ${pulse * 5}px rgba(240,100,22,${.16 * pulse})`;
      kc.style.transform = `translateY(${press * 1.5}px) scale(${1 + .06 * pulse})`;
      kc.style.borderColor = mix('#d9d1c5', '#f06416', Math.max(pulse * .8, press));
      kc.style.color = mix('#4a4540', '#c24d07', Math.max(pulse, press));
      $('#hint', r).style.opacity = gp * (1 - seg(lt, 2.15, 2.4));
      $('#sent', r).style.opacity = gp * (1 - seg(lt, 2.1, 2.3));
    } },
  { n: '07', dur: 3.3, tint: '#efeef8', eb: 'Changed files', h: ['Review it.', 'Send it back.'],
    cap: 'Comment on a diff line and send the review to the agent. Folders that hold several repositories work too.',
    head: ['workspace · 3 repositories', '3 changed'],
    body: `
      <div class="row" id="f1" style="top:8px"><b>admin/</b><span style="color:#4a4540">src/pages/Retry.tsx</span><span class="st"><span class="add">+12</span> <span class="del">−2</span></span></div>
      <div class="row" id="f2" style="top:36px;background:#f6f1ff"><b>app/</b><span style="color:#1d1d1f;font-weight:600">lib/net/client.dart</span><span class="st"><span class="add">+18</span> <span class="del">−3</span></span></div>
      <div class="diff" id="df" style="top:64px;height:68px"><div class="c"> 40  for (var n = 0; n &lt; max; n++) {</div><div class="m">-41    await sleep(base);</div><div class="p">+41    final delay = base * pow(2, n);</div><div class="p" id="dl">+42    await sleep(delay + jitter());</div></div>
      <div id="pl" class="a" style="left:19px;top:112px;width:14px;height:14px;border-radius:4px;background:#5b6cff;color:#fff;font:700 11px/14px var(--sans);text-align:center;opacity:0">+</div>
      <div id="cm" class="a" style="left:18px;right:18px;top:136px;height:38px;border:1px solid #cfd4ff;border-radius:9px;background:#f4f5ff;padding:0 11px;display:flex;align-items:center;gap:8px;font:400 11px/1 var(--sans)"><i style="flex:none;width:20px;height:20px;border-radius:50%;background:#1d1d1f;color:#fff;font:600 7px/20px var(--sans);text-align:center;font-style:normal">YOU</i><span><span class="t"></span><i class="caret" style="height:12px"></i></span></div>
      <div class="row" id="f3" style="top:182px"><b>app/</b><span style="color:#4a4540">lib/net/backoff.dart</span><span class="st"><span class="add">+34</span></span></div>
      <div id="bar" class="a" style="left:0;right:0;bottom:0;height:40px;border-top:1px solid #efe8dd;background:#fffdf9">
        <div class="a" id="cnt" style="left:18px;top:0;height:40px;display:flex;align-items:center;font:400 10px/1 var(--sans);color:#8c867d"></div>
        <div class="btn dark" id="sr" style="right:18px;top:8px;height:24px;background:#5b3df5">Send review</div>
        <div class="a" id="ok" style="right:18px;top:0;height:40px;display:flex;align-items:center;gap:6px;font:600 10.5px/1 var(--sans);color:#2f9e5b;opacity:0">${CHECK('#2f9e5b')}Review sent</div>
      </div>`,
    update(r, lt) {
      vis($('#f1', r), lt, .15); vis($('#f2', r), lt, .3);
      const dp = eo(seg(lt, .6, 1.0));
      const df = $('#df', r); df.style.opacity = dp; df.style.transform = `translateY(${(1 - dp) * -6}px)`;
      const f3 = $('#f3', r), cmShow = eo(seg(lt, 1.6, 1.9));
      vis(f3, lt, .5);
      const hover = seg(lt, 1.1, 1.25) * (1 - seg(lt, 1.6, 1.7));
      $('#pl', r).style.opacity = hover; $('#dl', r).style.background = mix('#eaf7ee', '#d9f0e1', hover);
      const cm = $('#cm', r); cm.style.opacity = cmShow; cm.style.transform = `translateY(${(1 - cmShow) * -6}px)`;
      typed($('#cm .t', r), 'Cap the delay at 30s.', lt, 1.8, 32);
      $('#cm .caret', r).style.opacity = lt > 1.8 && lt < 2.7 ? blink(lt) : 0;
      $('#cnt', r).textContent = lt > 1.9 ? '1 comment' : '';
      const press = seg(lt, 2.5, 2.58) * (1 - seg(lt, 2.6, 2.7)), sent = seg(lt, 2.7, 2.9);
      const sr = $('#sr', r); sr.style.transform = `scale(${1 - .06 * press})`; sr.style.opacity = (lt > 1.9 ? 1 : .45) * (1 - sent);
      $('#ok', r).style.opacity = sent;
      vis($('#bar', r), lt, .4, .3, 4);
    } },
  { n: '08', dur: 2.8, tint: '#eaeff8', eb: 'Projects', h: ['Every project.', 'One rail.'],
    cap: 'Sessions group by repository, worktrees included. Anything waiting on you rises to the top.',
    head: null,
    body: `
      <div class="a" id="tb" style="left:19px;top:15px;height:24px;width:112px;border-radius:8px;background:#f1ece4;padding:2px;display:flex;font:500 10.5px/20px var(--sans);color:#8c867d"><span style="flex:1;text-align:center;background:#fff;border-radius:6px;color:#1d1d1f;box-shadow:0 1px 2px rgba(0,0,0,.08)">Project</span><span style="flex:1;text-align:center">Status</span></div>
      <div id="gw" class="gl" style="left:20px;top:52px;opacity:0;color:#d36a10">Waiting on you</div>
      <div id="ga" class="gl" style="left:20px;top:52px">api-server</div>
      <div id="r1" class="proj" style="top:72px;background:#f6f1e9"><b>Add retry with backoff</b><s>api-server</s><i class="dot"></i></div>
      <div id="r2" class="proj" style="top:116px"><b>Refactor auth middleware</b><s>api-server</s><i class="dot"></i></div>
      <div id="gs" class="gl" style="left:20px;top:168px">web-shop</div>
      <div id="r3" class="proj" style="top:188px"><b>Write release notes for 2.4</b><s>web-shop</s><i class="dot" id="r3d"></i><span class="tag" id="r3t" style="opacity:0">Waiting</span></div>`,
    update(r, lt) {
      vis($('#tb', r), lt, .1);
      ['#ga', '#r1', '#r2', '#gs', '#r3'].forEach((s, i) => { const e = $(s, r); vis(e, lt, .2 + i * .1); });
      const mv = eio(seg(lt, 1.2, 1.85));
      const r3 = $('#r3', r), gs = $('#gs', r);
      r3.style.top = lerp(188, 72, mv) + 'px';
      gs.style.opacity = Math.min(parseFloat(gs.style.opacity), 1 - seg(lt, 1.15, 1.45));
      $('#ga', r).style.top = lerp(52, 124, mv) + 'px';
      $('#r1', r).style.top = lerp(72, 144, mv) + 'px';
      $('#r2', r).style.top = lerp(116, 188, mv) + 'px';
      const gw = $('#gw', r); gw.style.opacity = seg(lt, 1.5, 1.9);
      const w = seg(lt, 1.6, 1.95);
      $('#r3d', r).style.background = mix('#c9c3ba', '#f06416', w);
      $('#r3t', r).style.opacity = w;
      r3.style.background = mix('#ffffff', '#fff7ef', w);
    } }
];

const INTRO_END = 3.3, OUTRO_DUR = 2.4;
const T = []; let acc = INTRO_END;
SCENES.forEach(s => { s.start = acc; s.end = acc + s.dur; acc = s.end; });
const OUTRO_START = acc, TOTAL = acc + OUTRO_DUR;
window.TOTAL = TOTAL;

function dotNumber(canvas, text) {
  const W = 132, H = 92, off = document.createElement('canvas'), S = 2;
  off.width = W * S; off.height = H * S;
  const c = off.getContext('2d');
  c.font = `700 ${100 * S}px "Helvetica Neue",Helvetica,Arial`; c.textBaseline = 'alphabetic'; c.fillStyle = '#000';
  c.fillText(text, 0, 82 * S);
  const d = c.getImageData(0, 0, off.width, off.height).data, pitch = 4.2, pts = [];
  for (let y = pitch / 2; y < H; y += pitch) for (let x = pitch / 2; x < W; x += pitch) {
    if (d[((Math.floor(y * S)) * off.width + Math.floor(x * S)) * 4 + 3] > 128) pts.push([x, y]);
  }
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas._pts = pts;
}
function drawNumber(canvas, lt) {
  const c = canvas.getContext('2d'); c.setTransform(DPR, 0, 0, DPR, 0, 0); c.clearRect(0, 0, 132, 92);
  for (const [x, y] of canvas._pts) {
    const p = eo(seg(lt, .05 + x * .004 + y * .0015, .05 + x * .004 + y * .0015 + .3));
    if (p <= 0) continue;
    c.globalAlpha = p; c.fillStyle = '#f06416'; c.beginPath(); c.arc(x, y, 1.75 * (.3 + .7 * p), 0, 7); c.fill();
  }
  c.globalAlpha = 1;
}

const scenesEl = $('#scenes');
SCENES.forEach((s, i) => {
  const el = document.createElement('section'); el.className = 'scene';
  el.innerHTML = `<canvas class="num"></canvas><div class="eyebrow"><i></i>${s.eb}</div><h2><span class="h1">${s.h[0]}</span><span class="h2 g">${s.h[1]}</span></h2><p class="cap">${s.cap}</p>
    <div class="win">${s.head ? `<div class="wh"><span>${s.head[0]}</span><em>${s.head[1] === 'working' || s.head[1] === 'waiting' ? '<i></i>' : ''}${s.head[1]}</em></div>` : ''}<div class="wb${s.head ? '' : ' full'}">${s.body}</div></div>`;
  scenesEl.appendChild(el); s.el = el;
  s.num = $('.num', el); s.num.style.width = '132px'; s.num.style.height = '92px'; dotNumber(s.num, s.n);
  s.win = $('.win', el); s.wb = $('.wb', el);
});

const big = $('#big'), bctx = big.getContext('2d');
big.width = 960 * DPR; big.height = 540 * DPR;
const MD = MASCOT.dots, BR = rng(11), BX = 128, BY = 154, BS = 236, BP = BS / MD.cols;
const BDOTS = MD.cells.map(([c, r, h]) => {
  const g = () => BR() + BR() + BR() - 1.5;
  return { tx: BX + c * BP + BP / 2, ty: BY + r * BP + BP / 2, col: hex('#' + h), sx: 480 + g() * 210, sy: 270 + g() * 150, d: BR() * .95, sr: .8 + BR() * 1.6, ph: BR() * 6.28, grain: BR() };
});
function drawBig(t) {
  bctx.setTransform(DPR, 0, 0, DPR, 0, 0); bctx.clearRect(0, 0, 960, 540);
  const outro = t > OUTRO_START - .4;
  const vis_ = outro ? seg(t, OUTRO_START - .02, OUTRO_START + .12) : 1 - seg(t, INTRO_END - .25, INTRO_END);
  if (vis_ <= 0) return;
  for (const d of BDOTS) {
    let p, x, y, a, rad;
    if (!outro) {
      p = eio(seg(t, .12 + d.d, .12 + d.d + 1.15));
      x = lerp(d.sx + Math.sin(t * 1.4 + d.ph) * 4 * (1 - p), d.tx, p); y = lerp(d.sy + Math.cos(t * 1.1 + d.ph) * 4 * (1 - p), d.ty, p);
      a = .35 + .65 * p; rad = lerp(d.sr, BP * .47, p);
    } else {
      p = eo(seg(t, OUTRO_START + (d.tx - BX) * .0016 + (d.ty - BY) * .0008, OUTRO_START + .65 + (d.tx - BX) * .0016 + (d.ty - BY) * .0008));
      x = d.tx; y = d.ty + (1 - p) * 6; a = p; rad = BP * .47 * (.4 + .6 * p);
    }
    bctx.globalAlpha = a * vis_; bctx.fillStyle = `rgb(${d.col[0]},${d.col[1]},${d.col[2]})`;
    bctx.beginPath(); bctx.arc(x, y, rad, 0, 7); bctx.fill();
  }
  bctx.globalAlpha = 1;
}

// The app's own small-size sprite (drawn for 40/80 px), not the icon shrunk down:
// the icon's painted detail turns to mush at this size.
const small = $('#small');
const SPRITE = 80, SX = 806, SBASE = 136 - SPRITE + 3;
const FACE = { coding: 0, sleepy: 1, surprised: 2, celebrate: 3 };
const SCENE_FACE = ['coding', 'surprised', 'celebrate', 'coding', 'surprised', 'coding', 'coding', 'celebrate'];
small.style.left = SX + 'px';

const bars = $('#out-bars'), BARC = ['#f06416', '#f59a22', '#efb84a', '#22a05a', '#3b78e0'];
BARC.forEach((c, i) => { const b = document.createElement('i'); b.style.cssText = `position:absolute;top:0;height:5px;border-radius:3px;width:48px;left:${i * 58}px;background:${c};transform-origin:left;display:block`; bars.appendChild(b); });

function renderAt(t) {
  t = Math.min(Math.max(t, 0), TOTAL);
  const cols = [['#f6f4f0', 0], ...SCENES.map(s => [s.tint, s.start]), ['#f6f4f0', OUTRO_START]];
  let bg = cols[0][0];
  for (let i = 1; i < cols.length; i++) bg = mix(bg, cols[i][0], eio(seg(t, cols[i][1] - .25, cols[i][1] + .25)));
  $('#bg').style.background = bg;

  const intro = $('#intro'); intro.style.opacity = 1 - seg(t, INTRO_END - .25, INTRO_END);
  put($('#in-eb'), eo(seg(t, 1.5, 1.85)), 6);
  put($('#in-l1'), eo(seg(t, 1.7, 2.15)), 12);
  const l2 = eo(seg(t, 1.9, 2.35)); $('#in-on').style.opacity = l2; $('#in-on').style.transform = `translateY(${(1 - l2) * 12}px)`;
  const pl = eio(seg(t, 2.25, 2.8)); const pe = $('#in-pill'); pe.style.opacity = pl > 0 ? 1 : 0; pe.style.transform = `scaleX(${pl})`;
  const dtp = eo(seg(t, 2.35, 2.8)); $('#in-dt').style.opacity = dtp; $('#in-dt').style.transform = `translateY(${(1 - dtp) * 10}px)`;
  const dp = eo(seg(t, 2.7, 3.0)); $('#in-dot').style.opacity = dp;

  SCENES.forEach(s => {
    const lt = t - s.start, op = seg(t, s.start, s.start + .18) * (1 - seg(t, s.end - .18, s.end));
    s.el.style.opacity = op; s.el.style.display = op > 0 ? 'block' : 'none';
    if (op <= 0) return;
    drawNumber(s.num, lt);
    const e = $('.eyebrow', s.el), h1 = $('.h1', s.el), h2 = $('.h2', s.el), cap = $('.cap', s.el);
    put(e, eo(seg(lt, .1, .4)), 6); put(h1, eo(seg(lt, .2, .55)), 12); put(h2, eo(seg(lt, .33, .68)), 12); put(cap, eo(seg(lt, .5, .85)), 10);
    const wp = eo(seg(lt, -.1, .45));
    s.win.style.transform = `translateY(${(1 - wp) * 14}px) scale(${.985 + .015 * wp})`;
    s.update(s.wb, Math.max(lt, 0));
  });

  const first = SCENES[0].start, last = SCENES[SCENES.length - 1].end;
  const sm = seg(t, first - .05, first + .05) * (1 - seg(t, last - .25, last));
  small.style.opacity = sm;
  const drop = bounce(seg(t, first, first + .7)), bob = 2 * (.5 - .5 * Math.cos((t - first) * 2 * Math.PI / 2.4)) * seg(t, first + .8, first + 1.1);
  small.style.top = (SBASE - (1 - drop) * 70 - bob) + 'px';
  let current = 0;
  SCENES.forEach((s, i) => { if (t >= s.start) current = i; });
  small.style.backgroundPosition = `${-FACE[SCENE_FACE[current]] * SPRITE}px 0`;
  const pop = current > 0 ? 1 - eo(seg(t, SCENES[current].start, SCENES[current].start + .22)) : 0;
  small.style.transform = `scale(${1 - .1 * pop}, ${1 + .06 * pop})`;

  const out = $('#outro'); out.style.opacity = seg(t, OUTRO_START, OUTRO_START + .15);
  const ot = t - OUTRO_START;
  put($('#out-name'), eo(seg(ot, .1, .55)), 14);
  [...bars.children].forEach((b, i) => { b.style.transform = `scaleX(${eo(seg(ot, .35 + i * .08, .7 + i * .08))})`; });
  put($('#out-tag'), eo(seg(ot, .45, .85)), 10); put($('#out-sub'), eo(seg(ot, .6, .95)), 8); put($('#out-cmd'), eo(seg(ot, .8, 1.2)), 8);
  drawBig(t);
  $('#veil').style.opacity = seg(t, TOTAL - .25, TOTAL);
}
window.renderAt = renderAt;
renderAt(0);
</script>
