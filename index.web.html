<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#09090a" />
    <!-- Vite replaces this marker with the remote client's CSP. The desktop build
         uses index.html, whose policy forbids every network destination; this one
         must reach its own origin for /api. -->
    <meta id="gajae-web-csp" http-equiv="Content-Security-Policy" content="default-src 'none'" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gajae" />
    <meta name="description" content="Gajae 데스크톱 호스트의 GJC 세션을 원격에서 조회하고 조작합니다." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <title>Gajae 원격</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
